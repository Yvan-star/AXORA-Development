name: YM Visuals Website Checks

on:
  push:
    paths:
      - 'projects/ym-visuals-website/**'
      - '.github/workflows/ym-visuals-site-checks.yml'
  pull_request:
    paths:
      - 'projects/ym-visuals-website/**'
      - '.github/workflows/ym-visuals-site-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-site-checks:
    name: Static site stability checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run website regression tests
        run: node --test projects/ym-visuals-website/tests/site.test.cjs
